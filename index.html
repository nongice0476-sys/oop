<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Python OOP Year 2 — Class & Object Exam</title><style>
:root{color-scheme:dark;--bg:#07111f;--panel:#0d1b2f;--card:#11243d;--line:#2a4668;--text:#f3f7ff;--muted:#a9bdd9;--accent:#72a7ff;--good:#56ba89;--bad:#d76275}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,"Noto Sans Thai",Tahoma,sans-serif;line-height:1.68}header{position:sticky;top:0;z-index:20;background:#07111ff2;border-bottom:1px solid var(--line);backdrop-filter:blur(9px)}.toolbar{max-width:1500px;margin:auto;padding:11px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}h1{font-size:18px;margin:0 auto 0 0}select,button,textarea{font:inherit}select,button{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 11px}button.primary{background:#315fae}.active{outline:2px solid var(--accent)}.layout{max-width:1500px;margin:18px auto;padding:0 16px;display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}.qhead{display:flex;justify-content:space-between;gap:10px;color:var(--muted);margin-bottom:9px}.prompt{font-size:16px;line-height:1.8}code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#071525;padding:2px 5px;border-radius:5px}.options{display:grid;gap:8px;margin-top:12px}.option{display:flex;gap:9px;background:#0a1729;padding:11px;border-radius:10px;border:1px solid transparent}.correct{border-color:var(--good);background:#103226}.wrong{border-color:var(--bad);background:#3d1921}.written-question{background:#0b182b;border:1px solid var(--line);border-radius:12px;padding:14px}.label{display:inline-block;border-radius:999px;background:#173251;padding:3px 9px;margin-bottom:8px;font-weight:700}textarea{width:100%;min-height:190px;background:#081426;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:12px}.solution,.grade{margin-top:12px;padding:12px;border-radius:10px;background:#0a1729;border-left:3px solid var(--accent)}aside{position:sticky;top:82px;height:calc(100vh - 102px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.nav button.done{background:#1c3c35}.bar{height:10px;background:#071525;border-radius:999px;overflow:hidden}.bar>div{height:100%;background:var(--accent)}dialog{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:16px;width:min(720px,92%);padding:20px}dialog::backdrop{background:#0009}@media(max-width:1050px){.layout{grid-template-columns:1fr}aside{position:relative;top:0;height:auto}.toolbar{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch}.toolbar>*{flex:0 0 auto}}@media(max-width:700px){.layout{padding:0 10px}.card{padding:14px}.qhead{flex-direction:column}}</style></head><body>
<header><div class="toolbar"><h1>Python OOP — Class & Object</h1><select id="setSel"><option>ชุด 1</option><option>ชุด 2</option><option>ชุด 3</option></select><button class="tab active" data-part="mcq">ปรนัย 20</button><button class="tab" data-part="written">อัตนัย 5</button><button id="note">📘 Short Note</button><button id="copy">คัดลอกคำตอบ</button><button id="submit" class="primary">ส่งข้อสอบ</button><button id="reset">เริ่มใหม่</button></div></header>
<div class="layout"><main><section class="card"><h2 id="title"></h2><p style="color:var(--muted)">ยึดเฉพาะเนื้อหาที่อาจารย์สอน: Create Class/Object • Class Attributes • Class Methods • Naming Convention • pass • Object Properties • Modify/Delete Properties • Delete Objects</p></section><div id="qs"></div></main><aside><h3>ความคืบหน้า</h3><div id="progTxt"></div><div class="bar"><div id="bar"></div></div><h3>ไปยังข้อ</h3><div id="nav" class="nav"></div><h3>จำเร็ว</h3><p><code>class A:</code></p><p><code>a = A()</code></p><p><code>A.attr</code></p><p><code>a.prop = value</code></p><p><code>del a.prop</code></p><p><code>del a</code></p></aside></div>
